<style>
  :root{
    --bg:#08090B;
    --panel:rgba(255,255,255,.045);
    --panel-hover:rgba(255,255,255,.075);
    --line:rgba(255,255,255,.09);
    --orange:#FF5900;
    --text:#F5F6F7;
    --muted:#9AA1AC;
    --muted-dim:#6B7280;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 82% 4%, rgba(255,89,0,.24), transparent 34%),
      radial-gradient(circle at 6% 96%, rgba(255,89,0,.10), transparent 30%),
      linear-gradient(160deg, #140a04 0%, #08090B 42%, #0B0D11 100%);
    background-repeat:no-repeat;
    background-size:cover;
    color:var(--text);
    font-family:var(--font);
    min-height:100dvh;
  }
  .wrap{
    max-width:440px;
    margin:0 auto;
    padding:20px 18px 28px;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }

  /* ===== HEADER ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 2px 18px;
  }
  .logo{
    height:32px;
    width:auto;
    display:block;
  }
  .lang{
    display:flex;
    gap:6px;
  }
  .lang button{
    font-family:var(--font);
    font-size:12px;
    font-weight:600;
    width:34px;height:34px;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    color:var(--muted);
    border:1px solid var(--line);
    cursor:pointer;
    transition:all .15s ease;
  }
  .lang button:hover{border-color:rgba(255,89,0,.5);color:var(--text);background:rgba(255,255,255,.08)}
  .lang button.on{
    background:var(--orange);
    border-color:var(--orange);
    color:#150900;
  }
  .lang button:focus-visible,
  a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  /* ===== HERO ===== */
  .hero{
    padding:30px 2px 26px;
    color:var(--text);
  }
  .hero .tag{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--text);
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    padding:6px 14px 6px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .hero .tag::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--orange);
    flex-shrink:0;
  }
  .hero h1{
    font-weight:800;
    font-size:clamp(28px,7.6vw,38px);
    line-height:1.14;
    letter-spacing:-.02em;
    max-width:16ch;
  }
  .hero-sub{
    margin-top:14px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--muted);
    max-width:36ch;
    font-weight:400;
  }

  /* ===== BOTÃO HERÓI ===== */
  .cta{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:var(--orange);
    color:#150900;
    text-decoration:none;
    padding:18px 20px;
    margin:4px 0 28px;
    border-radius:16px;
    box-shadow:0 10px 26px rgba(255,89,0,.26), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(255,89,0,.34), inset 0 1px 0 rgba(255,255,255,.22)}
  .cta:active{transform:translateY(0);filter:brightness(.97)}
  .cta .t{
    font-weight:800;
    font-size:16.5px;
    letter-spacing:-.005em;
  }
  .cta .s{
    font-size:12px;
    color:rgba(21,9,0,.65);
    margin-top:3px;
    font-weight:500;
  }
  .cta .arrow{
    font-weight:700;
    font-size:18px;
    color:#150900;
    flex-shrink:0;
  }
  .cta-secondary{
    background:rgba(255,255,255,.045);
    color:var(--text);
    border:1px solid var(--line);
    box-shadow:none;
    margin:0 0 26px;
  }
  .cta-secondary:hover{
    transform:translateY(-2px);
    border-color:rgba(255,89,0,.4);
    background:rgba(255,255,255,.07);
    box-shadow:none;
  }
  .cta-secondary:active{transform:translateY(0);filter:none}
  .cta-secondary .t{font-weight:700;font-size:15px}
  .cta-secondary .s{color:var(--muted);font-weight:400}
  .cta-secondary .arrow{color:var(--orange)}

  /* ===== MAIS OPÇÕES ===== */
  .more{margin:2px 0 22px}
  .more .label{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted-dim);
    margin-bottom:2px;
  }
  .more .label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .mini{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    text-decoration:none;
    color:var(--text);
    padding:14px 2px;
    border-bottom:1px solid var(--line);
    transition:opacity .15s ease;
  }
  .mini:last-child{border-bottom:none}
  .mini:hover{opacity:.72}
  .mini:hover .go{transform:translateX(3px);color:var(--orange)}
  .mini .t{font-weight:600;font-size:13.5px;letter-spacing:-.005em}
  .mini .s{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
    font-weight:400;
  }
  .mini .go{
    font-size:14px;
    color:var(--muted-dim);
    flex-shrink:0;
    transition:transform .15s ease, color .15s ease;
  }

  /* ===== RODAPÉ ===== */
  footer{
    margin-top:auto;
    padding-top:26px;
    text-align:center;
  }
  footer .r18{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:11px;
    color:var(--muted-dim);
  }
  footer .r18 b{
    font-weight:600;
    color:var(--muted);
  }
  footer .dom{
    font-size:10.5px;
    color:rgba(255,255,255,.22);
    margin-top:8px;
    letter-spacing:.04em;
  }

  /* ===== ENTRADA ===== */
  @media (prefers-reduced-motion: no-preference){
    .fade{opacity:0;transform:translateY(10px);animation:in .45s ease forwards}
    .fade:nth-child(2){animation-delay:.06s}
    .fade:nth-child(3){animation-delay:.12s}
    .fade:nth-child(4){animation-delay:.18s}
    .fade:nth-child(5){animation-delay:.24s}
    .fade:nth-child(6){animation-delay:.30s}
    @keyframes in{to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
